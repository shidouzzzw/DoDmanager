# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

on:
  push:
    tags:
      - 'v*'
    # Etiket push edilemediğinde aynı iş akışı release/v0.1.0 dalından çalışır;
    # sürüm etiketi GitHub Release oluşturulurken otomatik atılır.
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: APK derle ve yayınla
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sürüm etiketini belirle
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${GITHUB_REF_NAME#release/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Sürüm: $TAG"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub koşucularında Android SDK hazır gelir; ayrı bir kurulum adımı
      # gerekmez, yalnızca eksik platform/NDK bileşenleri eklenir.
      - name: Android SDK/NDK bileşenleri
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f | head -1)
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Bağımlılıklar
        run: npm ci

      - name: Android iskeleti + katman
        run: ./scripts/android-setup.sh

      - name: İmza yapılandırması (varsa)
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEY_BASE64:-}" ]; then
            echo "İmza secret'ı yok: imzasız APK üretilecek."
            exit 0
          fi
          echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: APK derle
        run: npm run tauri android build -- --apk

      - name: APK'yı topla
        id: artifact
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "APK bulunamadı" >&2
            exit 1
          fi
          NAME="Dosya-Dolabi-${{ steps.version.outputs.tag }}.apk"
          cp "$APK" "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: İmza dosyasını sil
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" src-tauri/gen/android/keystore.properties

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Dosya Dolabı ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.artifact.outputs.name }}
            ${{ steps.artifact.outputs.name }}.sha256
          body: |
            Android 8.0+ (API 26) APK.

            İmza secret'ları tanımlıysa APK imzalıdır; tanımlı değilse **imzasız**
            yüklenir. İmzasız APK'yı kurmadan önce kendi anahtarınızla imzalayın:
            `apksigner sign --ks release.jks --out Dod.apk Dosya-Dolabi-*.apk`
            (ayrıntılar README → İmzalama).

            Kurulum: "Bilinmeyen kaynaklardan yüklemeye izin ver"i açın.
            Değişiklikler için CHANGELOG.md dosyasına bakın.

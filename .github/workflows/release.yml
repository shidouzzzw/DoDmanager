name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: APK derle ve yayınla
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK/NDK bileşenleri
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Bağımlılıklar
        run: npm ci

      - name: Android iskeleti + katman
        run: ./scripts/android-setup.sh

      - name: İmza yapılandırması (varsa)
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEY_BASE64:-}" ]; then
            echo "İmza secret'ı yok: imzasız APK üretilecek."
            exit 0
          fi
          echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: APK derle
        run: npm run tauri android build -- --apk

      - name: APK'yı topla
        id: artifact
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "APK bulunamadı" >&2
            exit 1
          fi
          NAME="Dosya-Dolabi-${GITHUB_REF_NAME}.apk"
          cp "$APK" "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: İmza dosyasını sil
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" src-tauri/gen/android/keystore.properties

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Dosya Dolabı ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.artifact.outputs.name }}
            ${{ steps.artifact.outputs.name }}.sha256
          body: |
            Android 8.0+ (API 26) için imzalı/imzasız APK.
            Kurulum: APK'yı indirin, "Bilinmeyen kaynaklardan yüklemeye izin ver"i açın.
            Değişiklikler için CHANGELOG.md dosyasına bakın.

# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

on:
  push:
    tags:
      - 'v*'
    # Etiket push edilemediğinde aynı iş akışı release/v0.1.0 dalından çalışır;
    # sürüm etiketi GitHub Release oluşturulurken atılır.
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: APK derle, imzala ve yayınla
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sürüm etiketini belirle
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${GITHUB_REF_NAME#release/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Sürüm: $TAG"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub koşucularında Android SDK hazır gelir; ayrı bir kurulum adımı
      # gerekmez, yalnızca eksik platform/NDK bileşenleri eklenir.
      - name: Android SDK/NDK bileşenleri
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f | head -1)
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Bağımlılıklar
        run: npm ci

      - name: Android iskeleti + katman
        run: ./scripts/android-setup.sh

      - name: APK derle
        run: npm run tauri android build -- --apk

      - name: APK'yı imzala ve doğrula
        id: sign
        env:
          TAG: ${{ steps.version.outputs.tag }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          ALIGN="$BT/zipalign"
          SIGNER="$BT/apksigner"

          SRC=$(find src-tauri/gen/android/app/build/outputs/apk -name '*universal*release*.apk' | head -1)
          if [ -z "$SRC" ]; then
            SRC=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          fi
          if [ -z "$SRC" ]; then
            echo "Release APK bulunamadı" >&2
            exit 1
          fi
          echo "Kaynak APK: $SRC"

          # İmza öncesi hizalama (v2 imzası hizalamadan sonra atılmalı).
          "$ALIGN" -p -f 4 "$SRC" aligned.apk

          if [ -n "${ANDROID_KEY_BASE64:-}" ]; then
            echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            KS="$RUNNER_TEMP/release.jks"
            ALIAS="$ANDROID_KEY_ALIAS"
            KS_PASS="$ANDROID_STORE_PASSWORD"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
            KIND="permanent"
            echo "APK kalıcı sürüm anahtarıyla imzalanacak."
          else
            KS="$RUNNER_TEMP/temp-release.jks"
            ALIAS="dod-temp"
            KS_PASS=$(openssl rand -hex 16)
            KEY_PASS="$KS_PASS"
            keytool -genkeypair \
              -keystore "$KS" \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Dosya Dolabi (gecici), OU=Release, O=DoD Manager, C=TR"
            KIND="temporary"
            echo "UYARI: imza secret'ı yok; geçici anahtarla imzalanacak."
          fi
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"

          NAME="Dosya-Dolabi-${TAG}.apk"
          case "$NAME" in
            *nsigned*) echo "HATA: dosya adında 'unsigned' geçemez" >&2; exit 1 ;;
          esac

          "$SIGNER" sign \
            --ks "$KS" \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$NAME" \
            aligned.apk

          # İmza doğrulanamazsa iş burada durur; Release adımı çalışmaz.
          "$SIGNER" verify --verbose --print-certs "$NAME" | tee verify.txt
          grep -q "Signer #1 certificate DN:" verify.txt
          if ! grep -q "Verified using v2 scheme" verify.txt; then
            echo "HATA: APK Signature Scheme v2 doğrulanamadı" >&2
            exit 1
          fi

          sha256sum "$NAME" > "$NAME.sha256"
          echo "### İmza doğrulaması" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat verify.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if [ "$KIND" = "permanent" ]; then
            cat > release-notes.md <<EOF
          Android 8.0+ (API 26) için Dosya Dolabı ${TAG}.

          - Paket: com.dod.manager
          - Sürüm: ${TAG#v} (versionCode 1)
          - SHA-256: $(cut -d' ' -f1 "$NAME.sha256")

          APK, projenin kalıcı sürüm anahtarıyla imzalandı; sonraki sürümler doğrudan güncellenebilir.
          EOF
          else
            cat > release-notes.md <<EOF
          Android 8.0+ (API 26) için Dosya Dolabı ${TAG}.

          - Paket: com.dod.manager
          - Sürüm: ${TAG#v} (versionCode 1)
          - SHA-256: $(cut -d' ' -f1 "$NAME.sha256")

          **Geçici anahtarla imzalandı.** APK kurulabilir ve imzası doğrulanmıştır; ancak
          anahtar her derlemede değiştiği için sonraki sürümü kurmadan önce eski sürümü
          kaldırmanız gerekebilir.

          Kalıcı ve güncellenebilir imza için depoya şu secret'ları ekleyin:
          ANDROID_KEY_BASE64, ANDROID_KEY_ALIAS, ANDROID_STORE_PASSWORD,
          ANDROID_KEY_PASSWORD (README → İmzalama).
          EOF
          fi

          echo "İmzalanan APK: $NAME"

      - name: Eski sürüm kaydını temizle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Aynı etiket için eski (imzasız) kayıt varsa kaldır; yeni APK temiz yüklenir.
          gh release delete "$TAG" --yes --cleanup-tag || true

      - name: İmza dosyalarını sil
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/temp-release.jks" \
            aligned.apk verify.txt src-tauri/gen/android/keystore.properties

      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Dosya Dolabı ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            Dosya-Dolabi-${{ steps.version.outputs.tag }}.apk
            Dosya-Dolabi-${{ steps.version.outputs.tag }}.apk.sha256

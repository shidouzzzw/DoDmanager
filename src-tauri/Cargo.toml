[package]
name = "dod-manager"
version = "0.1.0"
description = "Dosya Dolabı — Android için açık kaynak dosya yöneticisi"
authors = ["DoD Manager Contributors"]
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/shidouzzzw/DoDmanager"
readme = "../README.md"
publish = false

[lib]
name = "dod_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-haptics = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "gif",
  "webp",
  "bmp",
] }
# Yalnızca deflate: bzip2-sys C derleyicisi gerektirir; saf Rust zinciri tercih edilir.
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
mime_guess = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"

[features]
# Varsayılan özellik yok; Android hedefi dışında da derlenebilir (CI lint).
default = []
